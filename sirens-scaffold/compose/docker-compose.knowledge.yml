# ----------------------------------------------------------------------------
# Sirens — Phase 1 knowledge spine
# OpenCTI + MISP + TheHive + Cortex with shared deps.
# Dev-grade. Production hardening notes in README.md.
# ----------------------------------------------------------------------------

name: sirens-knowledge

x-restart-policy: &restart unless-stopped

services:

  # ---------- Shared infra ----------

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.4}
    restart: *restart
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery=ERROR
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    restart: *restart
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: *restart
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: *restart
    command: server /data --console-address ":9101"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  cassandra:
    image: cassandra:4.1
    restart: *restart
    environment:
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
      - CASSANDRA_CLUSTER_NAME=sirens-thp
    volumes:
      - cassandra_data:/var/lib/cassandra

  mariadb:
    image: mariadb:10.11
    restart: *restart
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=1024M
      - --innodb-change-buffering=none
      - --innodb-io-capacity=1000
      - --innodb-read-only-compressed=OFF
      - --innodb-stats-persistent=ON
      - --max-allowed-packet=1024M

  # ---------- OpenCTI ----------

  opencti:
    image: opencti/platform:6.4.6
    restart: *restart
    depends_on: [redis, elasticsearch, minio, rabbitmq]
    environment:
      - NODE_OPTIONS=--max-old-space-size=8096
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__APP_LOGS__LOGS_LEVEL=info
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - REDIS__PASSWORD=${REDIS_PASSWORD}
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SMTP__HOSTNAME=localhost
      - SMTP__PORT=25
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
    ports:
      - "8080:8080"

  opencti-worker:
    image: opencti/worker:6.4.6
    restart: *restart
    depends_on: [opencti]
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - WORKER_LOG_LEVEL=info
    deploy:
      replicas: 2

  # ---------- MISP ----------

  misp:
    image: ghcr.io/nukib/misp:latest
    restart: *restart
    depends_on: [mariadb, redis]
    ports:
      - "443:443"
      - "80:80"
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MISP_BASEURL=${MISP_BASE_URL}
      - MISP_EMAIL=${MISP_ADMIN_EMAIL}
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSWORD}
      - MISP_ADMIN_KEY=${MISP_ADMIN_KEY}
    volumes:
      - misp_files:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs

  misp-modules:
    image: ghcr.io/misp/misp-modules:latest
    restart: *restart
    depends_on: [redis]
    environment:
      - REDIS_BACKEND=redis
      - REDIS_PORT=6379
      - REDIS_PW=${REDIS_PASSWORD}

  # ---------- TheHive + Cortex ----------

  thehive:
    image: strangebee/thehive:5.4
    restart: *restart
    depends_on: [cassandra, elasticsearch, minio]
    ports:
      - "9000:9000"
    command:
      - --no-config
      - --no-config-secret
    environment:
      - JVM_OPTS=-Xms2g -Xmx2g
    volumes:
      - thehive_conf:/etc/thehive
      - thehive_data:/var/lib/thehive
    configs:
      - source: thehive_application_conf
        target: /etc/thehive/application.conf

  cortex:
    image: thehiveproject/cortex:3.1.8
    restart: *restart
    depends_on: [elasticsearch]
    ports:
      - "9001:9001"
    environment:
      - JVM_OPTS=-Xms1g -Xmx1g
    volumes:
      - cortex_data:/var/lib/cortex
      - cortex_conf:/etc/cortex
      - /var/run/docker.sock:/var/run/docker.sock

# ---------- Inline configs ----------

configs:
  thehive_application_conf:
    content: |
      play.http.secret.key = "${THEHIVE_SECRET}"
      db.janusgraph {
        storage {
          backend = cql
          hostname = ["cassandra"]
          cql.cluster-name = sirens-thp
          cql.keyspace = thehive
        }
        index.search {
          backend = elasticsearch
          hostname = ["elasticsearch"]
          index-name = thehive
        }
      }
      storage {
        provider = s3
        s3 {
          bucket = "thehive"
          endpoint = "http://minio:9000"
          accessKey = "${MINIO_ROOT_USER}"
          secretKey = "${MINIO_ROOT_PASSWORD}"
          region = "us-east-1"
          pathStyleAccess = true
        }
      }
      auth.providers = [
        { name = session }
        { name = local }
      ]
      user.autoCreateOnSso = false

# ---------- Volumes ----------

volumes:
  es_data:
  redis_data:
  rabbit_data:
  minio_data:
  cassandra_data:
  mariadb_data:
  misp_files:
  misp_logs:
  thehive_conf:
  thehive_data:
  cortex_data:
  cortex_conf:
