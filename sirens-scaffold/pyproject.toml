[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sirens"
version = "0.1.0"
description = "Sirens — threat-hunting agent swarm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sirens Team" }]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
bootstrap = [
    "pycti==6.4.6",
    "pymisp>=2.4.190",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
