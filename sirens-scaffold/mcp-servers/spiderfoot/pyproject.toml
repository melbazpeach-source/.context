[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sirens-mcp-spiderfoot"
version = "0.1.0"
description = "MCP server wrapping SpiderFoot OSS"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.scripts]
sirens-mcp-spiderfoot = "sirens_mcp_spiderfoot.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sirens_mcp_spiderfoot"]
