[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sirens-mcp-velociraptor"
version = "0.1.0"
description = "MCP server wrapping Velociraptor DFIR"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyvelociraptor>=0.7",
    "grpcio>=1.60",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.scripts]
sirens-mcp-velociraptor = "sirens_mcp_velociraptor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sirens_mcp_velociraptor"]
